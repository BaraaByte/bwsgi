[build-system]
requires = ["setuptools>=77.0.0", "wheel"] # Updated minimum version for PEP 639
build-backend = "setuptools.build_meta"

[project]
name = "vinod"
version = "0.1.0"
description = "Ultra-lightweight, zero-dependency Python WSGI framework with Flask-style routing and Django-style auth."
readme = "README.md"
requires-python = ">=3.9"

# Modern PEP 639 standard configurations
license = "MIT"
license-files = ["LICENSE"] 

authors = [{ name = "Baraa Ahmed", email = "baraa.runtime@gmail.com" }]
keywords = ["wsgi", "framework", "zero-dependency", "serv00", "freebsd", "flask-like"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # Removed the deprecated "License :: OSI Approved" classifier line
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: WSGI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BaraaByte/vinod"
Repository = "https://github.com/BaraaByte/vinod"
Issues = "https://github.com/BaraaByte/vinod/issues"

[tool.setuptools]
packages = ["vinod"]
include-package-data = true
