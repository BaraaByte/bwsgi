[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bwsgi"
version = "0.1.0"
description = "Ultra-lightweight, zero-dependency Python WSGI framework"
readme = "README.md"
requires-python = ">=3.9"

# Modern PEP 639 standard configurations
license = "MIT"
license-files = ["LICENSE"] 

authors = [{ name = "Baraa Ahmed", email = "baraa.runtime@gmail.com" }]
keywords = ["wsgi", "framework", "zero-dependency", "serv00", "freebsd", "flask-like"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # Removed the invalid "Framework :: WSGI" line to fix the 400 Bad Request error
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BaraaByte/bwsgi"
Repository = "https://github.com/BaraaByte/bwsgi"
Issues = "https://github.com/BaraaByte/bwsgi/issues"

[tool.setuptools]
packages = ["vinod"]
include-package-data = true
