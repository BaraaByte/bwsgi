[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwsgi-additional"
version = "0.1.0"
description = "Optional middleware and helpers for Bwsgi"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["bwsgi>=0.1.1"]

[tool.setuptools]
packages = ["bwsgi_additional"]
