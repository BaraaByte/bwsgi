[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwsgi-itsdangerous"
version = "0.1.0"
description = "Optional ItsDangerous signing integration for Bwsgi"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["bwsgi>=0.1.1", "itsdangerous>=2.2,<3"]

[tool.setuptools]
packages = ["bwsgi_itsdangerous"]
